name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies (workspaces)
        run: npm install

      - name: Build (tsc) — core then editions
        run: |
          npm run build --workspace=airirang-builder-core
          npm run build --workspace=airirang-builder
          npm run build --workspace=airirang-builder-bedrock

      - name: Lint (eslint)
        run: npm run lint

      - name: Test (vitest) — core + java + bedrock
        run: |
          npm test --workspace=airirang-builder-core
          npm test --workspace=airirang-builder
          npm test --workspace=airirang-builder-bedrock

      - name: npm pack --dry-run (core + java + bedrock)
        run: |
          for d in core java bedrock; do (cd "packages/$d" && npm pack --dry-run); done
